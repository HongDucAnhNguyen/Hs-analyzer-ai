# Base infrastructure services (Redis and RabbitMQ)
# This file can be used as a foundation for different deployment environments

services:
  redis:
    image: redis:7-alpine
    container_name: classification-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - classification-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: classification-rabbitmq
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - classification-network

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  classification-network:
    driver: bridge
